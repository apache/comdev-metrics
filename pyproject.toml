[project]
name = "asfmetrics"
version = "0.1.0"
description = "Apache Community Development project metrics dashboard"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
asfmetrics = "asfmetrics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asfmetrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# F: pyflakes (unused imports/variables, undefined names)
# E9/E7: syntax and statement errors
# B: bugbear (likely bugs)
# DTZ: naive datetime calls without a timezone
# UP: pyupgrade
select = ["F", "E7", "E9", "B", "DTZ", "UP"]
